<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DGX Process Manager</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #111827; color: #e5e7eb; }
    header { padding: 18px 24px; background: #1f2937; position: sticky; top: 0; z-index: 2; }
    h1 { margin: 0 0 10px; font-size: 1.35rem; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, select, button { border: 1px solid #4b5563; border-radius: 5px; padding: 7px 10px; background: #111827; color: #e5e7eb; }
    button { cursor: pointer; background: #374151; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    #message { min-height: 1.3em; color: #fbbf24; }
    .table-wrap { overflow: auto; padding: 14px 24px 28px; }
    table { width: 100%; border-collapse: collapse; font-size: .86rem; white-space: nowrap; }
    th, td { border-bottom: 1px solid #374151; padding: 8px 7px; text-align: left; vertical-align: top; }
    /* Keep the table header in thead order; a sticky offset used to place PID 1 above it. */
    th { background: #1f2937; }
    .sort-button { border: 0; padding: 0; background: transparent; color: inherit; font: inherit; font-weight: 700; }
    .sort-button:hover, .sort-button:focus-visible { color: #93c5fd; }
    .sort-indicator { color: #93c5fd; margin-left: 3px; }
    .category-tags { display: flex; gap: 7px; flex-wrap: wrap; padding: 0 24px 4px; }
    .category-tag { border-radius: 999px; padding: 5px 11px; background: #374151; color: #e5e7eb; }
    .category-tag.system { background: #7f1d1d; color: #fecaca; }
    .category-tag.user { background: #1e3a8a; color: #bfdbfe; }
    .category-tag[aria-pressed="false"] { opacity: .48; }
    .category-tag[aria-pressed="true"] { box-shadow: 0 0 0 1px #93c5fd; }
    .category-tag:hover, .category-tag:focus-visible { filter: brightness(1.2); }
    .category-tag-count { margin-left: 4px; opacity: .75; }
    .category-empty td { color: #9ca3af; padding: 18px 7px; text-align: center; }
    .memory-summary { padding: 10px 24px 8px; border-bottom: 1px solid #374151; }
    .memory-summary-heading { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
    .memory-summary-heading strong { font-size: .95rem; }
    .memory-total { color: #d1d5db; font-size: .82rem; }
    .memory-tags { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 8px; margin-top: 8px; }
    .memory-tag { min-height: 64px; text-align: left; display: flex; flex-direction: column; gap: 2px; border-radius: 8px; padding: 8px 10px; background: #1f2937; }
    .memory-tag strong { font-size: .78rem; }
    .memory-tag-value { font-size: .95rem; font-weight: 700; }
    .memory-tag-meta { color: #9ca3af; font-size: .72rem; }
    .memory-tag.gpu { border-color: #92400e; }
    .memory-tag.model-rss { border-color: #1d4ed8; }
    .memory-tag.active-other { border-color: #047857; }
    .memory-tag.cache { border-color: #6d28d9; }
    .memory-tag.free { border-color: #4b5563; }
    .memory-tag[aria-pressed="false"] { opacity: .58; }
    .memory-tag[aria-pressed="true"] { box-shadow: 0 0 0 1px #93c5fd; }
    .memory-tag:hover, .memory-tag:focus-visible { filter: brightness(1.2); }
    .memory-help { color: #9ca3af; font-size: .76rem; line-height: 1.45; margin-top: 8px; white-space: pre-line; }
    .action-buttons { display: flex; gap: 5px; }
    .badge { display: inline-block; border-radius: 999px; padding: 2px 7px; font-weight: 700; font-size: .72rem; }
    .system { background: #7f1d1d; color: #fecaca; }
    .user { background: #1e3a8a; color: #bfdbfe; }
    .kernel { background: #4b5563; color: #e5e7eb; }
    .reason { color: #fca5a5; font-size: .75rem; margin-top: 3px; }
    .command { max-width: 620px; overflow: hidden; text-overflow: ellipsis; }
    .protected { color: #9ca3af; font-size: .75rem; }
  </style>
</head>
<body>
  <header>
    <h1>DGX Process Manager — port 9001</h1>
    <div class="controls">
      <button id="refresh">Refresh</button>
      <label for="group-mode">Group by</label>
      <select id="group-mode">
        <option value="classification">Category (SYSTEM / USER)</option>
        <option value="reason">System reason</option>
        <option value="none">No groups</option>
      </select>
      <span id="message" role="status"></span>
    </div>
  </header>
  <section id="memory-summary" class="memory-summary" aria-label="RAM summary">
    <div class="memory-summary-heading">
      <strong>RAM breakdown</strong>
      <span id="memory-total" class="memory-total">Waiting for metrics…</span>
    </div>
    <div id="memory-tags" class="memory-tags"></div>
    <div id="memory-help" class="memory-help" role="note"></div>
  </section>
  <div id="category-tags" class="category-tags" aria-label="Process categories"></div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th><button class="sort-button" type="button" data-sort="classification">CLASS (SYSTEM / USER)<span class="sort-indicator"></span></button></th>
        <th><button class="sort-button" type="button" data-sort="reason">REASON<span class="sort-indicator"></span></button></th>
        <th><button class="sort-button" type="button" data-sort="pid">PID<span class="sort-indicator"></span></button></th>
        <th><button class="sort-button" type="button" data-sort="user">USER<span class="sort-indicator"></span></button></th>
        <th><button class="sort-button" type="button" data-sort="cpu">CPU<span class="sort-indicator"></span></button></th>
        <th><button class="sort-button" type="button" data-sort="rss">RAM<span class="sort-indicator"></span></button></th>
        <th><button class="sort-button" type="button" data-sort="gpu">GPU MEM<span class="sort-indicator"></span></button></th>
        <th><button class="sort-button" type="button" data-sort="command">COMMAND<span class="sort-indicator"></span></button></th>
        <th>ACTION</th>
      </tr></thead>
      <tbody id="processes"></tbody>
    </table>
  </div>
  <script>
    const message = document.getElementById('message');
    const body = document.getElementById('processes');
    const categoryTags = document.getElementById('category-tags');
    const memoryTotal = document.getElementById('memory-total');
    const memoryTags = document.getElementById('memory-tags');
    const memoryHelp = document.getElementById('memory-help');
    const groupMode = document.getElementById('group-mode');
    const sortButtons = Array.from(document.querySelectorAll('[data-sort]'));
    let currentProcesses = [];
    let currentMemory = null;
    let memoryFilter = 'all';
    let sortState = { key: 'pid', direction: 'asc' };
    const collapsedGroups = new Set();

    function formatBytes(value) {
      if (!value) return '0 B';
      const units = ['B', 'KiB', 'MiB', 'GiB'];
      let amount = value;
      let index = 0;
      while (amount >= 1024 && index < units.length - 1) { amount /= 1024; index++; }
      return amount.toFixed(index ? 1 : 0) + ' ' + units[index];
    }

    function formatMemoryValue(value, gigabyteDigits = 1) {
      const bytes = Number(value) || 0;
      const mb = Math.round(bytes / (1024 * 1024));
      const gb = bytes / (1024 * 1024 * 1024);
      const primary = gb >= 1 ? gb.toFixed(gigabyteDigits) + 'G' : mb.toLocaleString() + ' MB';
      return primary + ' · ' + mb.toLocaleString() + ' MB';
    }

    function memoryCategory(key) {
      return (currentMemory?.categories || []).find(category => category.key === key);
    }

    function memoryTagClass(key) {
      return {
        gpu_alloc: 'gpu',
        model_rss: 'model-rss',
        active_other: 'active-other',
        cache: 'cache',
        free: 'free',
      }[key] || '';
    }

    function memoryFilterProcesses(processes) {
      if (memoryFilter === 'all') return processes;
      if (memoryFilter === 'gpu_alloc') {
        return processes.filter(process => process.gpu_memory_bytes > 0);
      }
      if (memoryFilter === 'model_rss') {
        const pids = new Set(currentMemory?.model_rss_pids || []);
        return processes.filter(process => pids.has(process.pid));
      }
      if (memoryFilter === 'active_other') {
        return processes.filter(process => process.gpu_memory_bytes === 0 && process.rss_bytes > 0);
      }
      if (memoryFilter === 'cache' || memoryFilter === 'free') return [];
      return processes;
    }

    function memoryEmptyMessage() {
      if (memoryFilter === 'cache') return 'Cache is kernel page cache; it has no process or PID row.';
      if (memoryFilter === 'free') return 'Free RAM is a kernel metric; it has no process or PID row.';
      if (memoryFilter === 'active_other') return 'No non-GPU RSS candidates were found for Active other.';
      if (memoryFilter !== 'all') return 'No processes match this memory tag.';
      return 'No readable processes found.';
    }

    function renderMemorySummary(memory) {
      if (!memory) return;
      memoryTotal.textContent = formatMemoryValue(memory.total_bytes) +
        ' total · ' + formatMemoryValue(memory.used_bytes) + ' active · ' +
        formatMemoryValue(memory.available_bytes) + ' available';
      memoryTags.replaceChildren();
      const entries = [
        {
          key: 'all',
          label: 'RAM total',
          bytes: memory.total_bytes,
          meta: currentProcesses.length + ' readable processes',
          description: 'Show all readable process rows.',
        },
        ...(memory.categories || []).filter(category => category.key !== 'free'),
        memoryCategory('free'),
      ].filter(Boolean);
      for (const entry of entries) {
        const tag = document.createElement('button');
        tag.className = 'memory-tag ' + memoryTagClass(entry.key);
        tag.type = 'button';
        tag.dataset.memoryFilter = entry.key;
        tag.setAttribute('aria-pressed', String(memoryFilter === entry.key));
        tag.setAttribute('aria-label', 'Show ' + entry.label + ' process view');
        const label = document.createElement('strong');
        label.textContent = entry.label;
        tag.appendChild(label);
        const value = document.createElement('span');
        value.className = 'memory-tag-value';
        value.textContent = formatMemoryValue(entry.bytes, entry.key === 'model_rss' ? 0 : 1);
        tag.appendChild(value);
        const meta = document.createElement('span');
        meta.className = 'memory-tag-meta';
        if (entry.key === 'all') {
          meta.textContent = entry.meta;
        } else if (entry.scope === 'process') {
          meta.textContent = (entry.process_count || 0) + ' process rows';
        } else if (entry.scope === 'aggregate') {
          meta.textContent = (entry.process_count || 0) + ' possible non-GPU RSS candidates';
        } else {
          meta.textContent = 'kernel metric · no PID rows';
        }
        tag.appendChild(meta);
        tag.addEventListener('click', () => {
          memoryFilter = entry.key;
          renderMemorySummary(currentMemory);
          render(currentProcesses);
        });
        memoryTags.appendChild(tag);
      }
      memoryHelp.textContent = [
        '* Model RSS is the sum of the ten largest visible process RSS values; file-backed model pages can overlap GPU/cache.',
        'Active other is active RAM not covered by GPU allocation. It is a residual total, so its candidate process rows are not additive.',
        'Cache is reclaimable Linux page cache. It is kernel-owned memory, not a process, so there is no PID to kill.',
      ].join('\n');
    }

    function addCell(row, text, className) {
      const cell = document.createElement('td');
      if (className) cell.className = className;
      cell.textContent = text;
      row.appendChild(cell);
      return cell;
    }

    function reasonText(process) {
      return process.system_reason_labels.join(', ') || '—';
    }

    const sortAccessors = {
      classification: process => process.classification,
      reason: process => reasonText(process),
      pid: process => process.pid,
      user: process => process.user,
      cpu: process => process.cpu_percent,
      rss: process => process.rss_bytes,
      gpu: process => process.gpu_memory_bytes,
      command: process => process.cmdline,
    };

    function compareValues(left, right) {
      if (typeof left === 'number' && typeof right === 'number') return left - right;
      return String(left).localeCompare(String(right), undefined, { numeric: true, sensitivity: 'base' });
    }

    function sortProcesses(processes) {
      const accessor = sortAccessors[sortState.key] || sortAccessors.pid;
      const direction = sortState.direction === 'asc' ? 1 : -1;
      return [...processes].sort((left, right) => {
        const comparison = compareValues(accessor(left), accessor(right));
        return comparison === 0 ? left.pid - right.pid : comparison * direction;
      });
    }

    function groupLabel(process) {
      if (groupMode.value === 'classification') return process.classification || 'UNKNOWN';
      if (groupMode.value === 'reason') {
        return process.is_system ? (process.system_reason_labels.join(', ') || 'SYSTEM') : 'USER';
      }
      return 'All processes';
    }

    function groupKey(label) {
      return groupMode.value + ':' + label;
    }

    function appendProcessRow(process) {
      const row = document.createElement('tr');
      const classCell = document.createElement('td');
      const badge = document.createElement('span');
      badge.className = 'badge ' + (process.is_system ? 'system' : 'user');
      badge.textContent = process.classification;
      classCell.appendChild(badge);
      row.appendChild(classCell);
      addCell(row, reasonText(process), 'reason');
      addCell(row, String(process.pid));
      addCell(row, process.user);
      addCell(row, process.cpu_percent.toFixed(1) + '%');
      addCell(row, formatBytes(process.rss_bytes));
      addCell(row, formatBytes(process.gpu_memory_bytes));
      addCell(row, process.cmdline, 'command');
      const actionCell = document.createElement('td');
      const actionButtons = document.createElement('div');
      actionButtons.className = 'action-buttons';
      const stop = document.createElement('button');
      stop.textContent = 'Stop';
      stop.disabled = process.protected;
      stop.title = process.protected ? 'Protected system process' : 'Send SIGTERM';
      stop.addEventListener('click', () => stopProcess(process, false));
      actionButtons.appendChild(stop);
      const force = document.createElement('button');
      force.textContent = 'Force';
      force.disabled = process.protected;
      force.title = process.protected ? 'Protected system process' : 'Send SIGKILL';
      force.addEventListener('click', () => stopProcess(process, true));
      actionButtons.appendChild(force);
      actionCell.appendChild(actionButtons);
      if (process.protected) {
        const note = document.createElement('div');
        note.className = 'protected';
        note.textContent = 'protected';
        actionCell.appendChild(note);
      }
      row.appendChild(actionCell);
      body.appendChild(row);
    }

    function categoryClass(label) {
      return label === 'USER' ? 'user' : 'system';
    }

    function renderCategoryTags(groups) {
      categoryTags.replaceChildren();
      if (groupMode.value === 'none') return;
      for (const [label, processes] of groups) {
        const key = groupKey(label);
        const isOpen = !collapsedGroups.has(key);
        const tag = document.createElement('button');
        tag.className = 'category-tag ' + categoryClass(label);
        tag.type = 'button';
        tag.setAttribute('aria-pressed', String(isOpen));
        tag.setAttribute('aria-label', (isOpen ? 'Hide ' : 'Show ') + label + ' processes');
        tag.textContent = label;
        const count = document.createElement('span');
        count.className = 'category-tag-count';
        count.textContent = '(' + processes.length + ')';
        tag.appendChild(count);
        tag.addEventListener('click', () => toggleGroup(key));
        categoryTags.appendChild(tag);
      }
    }

    function toggleGroup(key) {
      if (collapsedGroups.has(key)) collapsedGroups.delete(key);
      else collapsedGroups.add(key);
      render(currentProcesses);
    }

    function appendMemoryMetricRow(category) {
      if (!category) {
        appendEmptyRow();
        return;
      }
      const row = document.createElement('tr');
      const classCell = document.createElement('td');
      const badge = document.createElement('span');
      badge.className = 'badge kernel';
      badge.textContent = 'KERNEL';
      classCell.appendChild(badge);
      row.appendChild(classCell);
      addCell(row, category.key === 'cache' ? 'reclaimable page cache' : 'free RAM', 'reason');
      addCell(row, '—');
      addCell(row, 'kernel');
      addCell(row, '—');
      addCell(row, formatMemoryValue(category.bytes));
      addCell(row, '0 B');
      addCell(row, category.description + ' No PID owns this memory.', 'command');
      const actionCell = document.createElement('td');
      const note = document.createElement('span');
      note.className = 'protected';
      note.textContent = 'not a process';
      actionCell.appendChild(note);
      row.appendChild(actionCell);
      body.appendChild(row);
    }

    function appendEmptyRow() {
      const row = document.createElement('tr');
      row.className = 'category-empty';
      const cell = document.createElement('td');
      cell.colSpan = 9;
      cell.textContent = memoryEmptyMessage();
      row.appendChild(cell);
      body.appendChild(row);
    }

    function render(processes) {
      body.replaceChildren();
      if (memoryFilter === 'cache' || memoryFilter === 'free') {
        renderCategoryTags(new Map());
        appendMemoryMetricRow(memoryCategory(memoryFilter));
        return;
      }
      const sorted = sortProcesses(memoryFilterProcesses(processes));
      if (groupMode.value === 'none') {
        renderCategoryTags(new Map());
        if (sorted.length) sorted.forEach(appendProcessRow);
        else appendEmptyRow();
        return;
      }
      const groups = new Map();
      for (const process of sorted) {
        const label = groupLabel(process);
        if (!groups.has(label)) groups.set(label, []);
        groups.get(label).push(process);
      }
      renderCategoryTags(groups);
      let visible = false;
      for (const [label, groupedProcesses] of groups) {
        if (!collapsedGroups.has(groupKey(label))) {
          groupedProcesses.forEach(appendProcessRow);
          visible = true;
        }
      }
      if (!visible) {
        appendEmptyRow();
      }
    }

    function updateSortIndicators() {
      for (const button of sortButtons) {
        const indicator = button.querySelector('.sort-indicator');
        const active = button.dataset.sort === sortState.key;
        indicator.textContent = active ? (sortState.direction === 'asc' ? ' ▲' : ' ▼') : '';
        button.setAttribute('aria-sort', active ? (sortState.direction === 'asc' ? 'ascending' : 'descending') : 'none');
      }
    }

    function toggleSort(key) {
      if (sortState.key === key) {
        sortState.direction = sortState.direction === 'asc' ? 'desc' : 'asc';
      } else {
        sortState = { key, direction: 'asc' };
      }
      updateSortIndicators();
      render(currentProcesses);
    }

    let loading = false;
    async function loadProcesses() {
      if (loading) return;
      loading = true;
      try {
        const response = await fetch('/api/processes', { cache: 'no-store' });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.message || payload.error_code);
        currentProcesses = payload.processes;
        currentMemory = payload.memory || null;
        renderMemorySummary(currentMemory);
        render(currentProcesses);
        message.textContent = 'Updated ' + new Date(payload.generated_at).toLocaleTimeString();
      } catch (error) {
        message.textContent = String(error.message || error);
      } finally {
        loading = false;
      }
    }

    async function stopProcess(process, force) {
      const label = process.classification + ' PID ' + process.pid;
      const reason = process.system_reason_labels.join(', ');
      const confirmation = force ? 'Force kill ' + label + '?' : 'Stop ' + label + '?';
      if (!window.confirm(reason ? confirmation + '\nReason: ' + reason : confirmation)) return;
      const response = await fetch('/api/processes/' + process.pid + '/stop', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ expected_create_time: process.create_time, confirm_system: process.is_system, force })
      });
      const payload = await response.json();
      message.textContent = payload.message || payload.error_code;
      await loadProcesses();
    }

    document.getElementById('refresh').addEventListener('click', loadProcesses);
    groupMode.addEventListener('change', () => render(currentProcesses));
    sortButtons.forEach(button => button.addEventListener('click', () => toggleSort(button.dataset.sort)));
    updateSortIndicators();
    loadProcesses();
    setInterval(loadProcesses, 2000);
  </script>
</body>
</html>
